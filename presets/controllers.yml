# Controller mapping presets.
#
# This file is compiled into the plugin, the config tool and the web page.
# Desktop: copy it to your data folder (Settings → "Open presets file" does this) and edit
# that copy. It's loaded instead of the built-in one, no rebuild needed.
#
# Easiest way to make a preset: pick your gamepad, run "Guided setup", then click
# "Export bindings as YAML preset" and paste the result below.
#
# Fields
#   name:       shown in the UI
#   note:       tooltip text (optional)
#   names:      device-name match, case-insensitive. A list of lists: the preset matches if
#               ALL substrings of ANY inner list appear in the device name.
#   ids:        "vvvv:pppp" USB/Bluetooth vendor:product ids (hex), alternative to names
#   platforms:  optional filter: any of web, windows, macos, linux. Raw codes differ per
#               platform, so presets using raw_* inputs should set this.
#   deadzone:   optional stick deadzone (0..1)
#   buttons:    N64 button → list of inputs (A B Z Start L R DUp DDown DLeft DRight CUp CDown CLeft CRight)
#   stick:      up/down/left/right → list of inputs
#
# Input forms
#   {type: button, button: South}            standard-layout button: South East North West
#                                            LeftShoulder LeftTrigger RightShoulder RightTrigger
#                                            Select Start Mode LeftThumb RightThumb
#                                            DPadUp DPadDown DPadLeft DPadRight C Z
#   {type: axis, axis: RightStickY, positive: true}
#                                            LeftStickX LeftStickY RightStickX RightStickY LeftZ RightZ DPadX DPadY
#   {type: raw_button, code: 3}              unmapped device button (see the web Debug tab)
#   {type: raw_axis, code: 2, positive: false}
#   {type: raw_hat, code: 56, dir: 0}         single-axis hat (browser): dir 0 up, 1 right, 2 down, 3 left
#
# Applying a preset replaces gamepad bindings only; keyboard keys are kept.

presets:
  - name: "8BitDo 64 — D mode"
    family: "8BitDo 64"
    mode: D
    note: >-
      Verified on macOS (Bluetooth, D switch position; reports as "8BitDo 64", 2dc8:3019).
      Both back triggers are Z. The D-pad reports as DPadX/DPadY axes. Don't bind the DPadLeft
      *button*: the mapping database labels the Star button as DPadLeft (code 589842).
      Extra buttons (unbound; free for macros, modifiers or the pak-swap hotkey):
      Home/8BitDo logo = Mode, Star = DPadLeft button (589842), Dash = Select,
      stick click = LeftThumb. On macOS, Home also opens the Games app (turn off in System
      Settings → Game Controllers).
    names: [["8bitdo", "64"]]
    ids: ["2dc8:3019"]
    # Browsers number buttons differently; a web D-mode preset needs its own capture.
    platforms: [macos, windows, linux]
    deadzone: 0.05
    buttons:
      A:      [{type: button, button: South}]
      B:      [{type: button, button: East}]
      Z:      [{type: button, button: LeftTrigger}, {type: button, button: RightTrigger}]
      Start:  [{type: button, button: Start}]
      L:      [{type: button, button: LeftShoulder}]
      R:      [{type: button, button: RightShoulder}]
      DUp:    [{type: axis, axis: DPadY, positive: true}]
      DDown:  [{type: axis, axis: DPadY, positive: false}]
      DLeft:  [{type: axis, axis: DPadX, positive: false}]
      DRight: [{type: axis, axis: DPadX, positive: true}]
      CUp:    [{type: axis, axis: RightStickY, positive: true}]
      CDown:  [{type: axis, axis: RightStickY, positive: false}]
      CLeft:  [{type: axis, axis: RightStickX, positive: false}]
      CRight: [{type: axis, axis: RightStickX, positive: true}]
    stick:
      up:    [{type: axis, axis: LeftStickY, positive: true}]
      down:  [{type: axis, axis: LeftStickY, positive: false}]
      left:  [{type: axis, axis: LeftStickX, positive: false}]
      right: [{type: axis, axis: LeftStickX, positive: true}]

  - name: "8BitDo 64 — D mode (browser)"
    family: "8BitDo 64"
    mode: D
    note: >-
      Captured in Chrome on macOS with guided setup (reports as "8BitDo 64 BT", 2dc8:3019, no
      standard mapping: 18 buttons, 10 axes). Both back triggers are Z (browser buttons 8 and 9),
      Start is button 11. C-Left/Right are browser axis 2, C-Up/Down are axis 5 (raw code 54,
      up = negative). The D-pad is a hat on axis 9 (raw code 58) that rests at 3.286.
    names: [["8bitdo", "64"]]
    ids: ["2dc8:3019"]
    platforms: [web]
    deadzone: 0.05
    buttons:
      A:      [{type: button, button: South}]
      B:      [{type: button, button: East}]
      Z:      [{type: button, button: Select}, {type: button, button: Start}]
      Start:  [{type: button, button: RightThumb}]
      L:      [{type: button, button: LeftTrigger}]
      R:      [{type: button, button: RightTrigger}]
      DUp:    [{type: raw_hat, code: 58, dir: 0}]
      DRight: [{type: raw_hat, code: 58, dir: 1}]
      DDown:  [{type: raw_hat, code: 58, dir: 2}]
      DLeft:  [{type: raw_hat, code: 58, dir: 3}]
      CUp:    [{type: raw_axis, code: 54, positive: false}]
      CDown:  [{type: raw_axis, code: 54, positive: true}]
      CLeft:  [{type: axis, axis: RightStickX, positive: false}]
      CRight: [{type: axis, axis: RightStickX, positive: true}]
    stick:
      up:    [{type: axis, axis: LeftStickY, positive: true}]
      down:  [{type: axis, axis: LeftStickY, positive: false}]
      left:  [{type: axis, axis: LeftStickX, positive: false}]
      right: [{type: axis, axis: LeftStickX, positive: true}]

  - name: "8BitDo 64 — S mode (macOS)"
    family: "8BitDo 64"
    mode: S
    note: >-
      Verified on macOS (Bluetooth, S switch position). In S mode the 8BitDo identifies as
      Nintendo's Switch Online N64 controller ("NSO N64 Controller", 057e:2019); this preset
      should also fit the Nintendo original. The mapping database reports all four C buttons
      as positive right-stick moves (C-Up and C-Down both read +RightStickY), so they're bound
      by raw code. Extras: Home = Mode, Star = raw button 589838. Dash and stick click send
      nothing in this mode.
    names: [["nso n64"], ["n64 controller"]]
    ids: ["057e:2019"]
    platforms: [macos]
    deadzone: 0.05
    buttons:
      A:      [{type: button, button: South}]
      B:      [{type: button, button: East}]
      Z:      [{type: button, button: LeftTrigger}, {type: button, button: RightTrigger}]
      Start:  [{type: button, button: Start}]
      L:      [{type: button, button: LeftShoulder}]
      R:      [{type: button, button: RightShoulder}]
      DUp:    [{type: axis, axis: DPadY, positive: true}]
      DDown:  [{type: axis, axis: DPadY, positive: false}]
      DLeft:  [{type: axis, axis: DPadX, positive: false}]
      DRight: [{type: axis, axis: DPadX, positive: true}]
      CUp:    [{type: raw_axis, code: 589827, positive: true}]
      CDown:  [{type: raw_axis, code: 589832, positive: true}]
      CLeft:  [{type: raw_axis, code: 589828, positive: true}]
      CRight: [{type: raw_axis, code: 589833, positive: true}]
    stick:
      up:    [{type: axis, axis: LeftStickY, positive: true}]
      down:  [{type: axis, axis: LeftStickY, positive: false}]
      left:  [{type: axis, axis: LeftStickX, positive: false}]
      right: [{type: axis, axis: LeftStickX, positive: true}]

  - name: "8BitDo 64 — S mode (HID)"
    family: "8BitDo 64"
    mode: S
    source: hid
    note: >-
      Raw HID bindings for S mode (Nintendo basic report 0x3F), captured byte-by-byte with
      tools/hid-listen. Works anywhere the device can be opened as HID: desktop, and Chrome/Edge
      via WebHID. Also fits Nintendo's Switch Online N64 controller. Home = byte 1 bit 4 and
      Star = byte 1 bit 5 are left unbound (on macOS, Home also opens the Games app). Dash and
      stick click send nothing in S mode.
    ids: ["057e:2019"]
    deadzone: 0.05
    buttons:
      A:      [{type: hid_bit, report: 63, byte: 0, bit: 1}]
      B:      [{type: hid_bit, report: 63, byte: 0, bit: 0}]
      Z:      [{type: hid_bit, report: 63, byte: 0, bit: 6}, {type: hid_bit, report: 63, byte: 1, bit: 2}]
      Start:  [{type: hid_bit, report: 63, byte: 1, bit: 1}]
      L:      [{type: hid_bit, report: 63, byte: 0, bit: 4}]
      R:      [{type: hid_bit, report: 63, byte: 0, bit: 5}]
      DUp:    [{type: hid_hat, report: 63, byte: 2, dir: 0}]
      DRight: [{type: hid_hat, report: 63, byte: 2, dir: 1}]
      DDown:  [{type: hid_hat, report: 63, byte: 2, dir: 2}]
      DLeft:  [{type: hid_hat, report: 63, byte: 2, dir: 3}]
      CUp:    [{type: hid_bit, report: 63, byte: 0, bit: 2}]
      CDown:  [{type: hid_bit, report: 63, byte: 0, bit: 7}]
      CLeft:  [{type: hid_bit, report: 63, byte: 0, bit: 3}]
      CRight: [{type: hid_bit, report: 63, byte: 1, bit: 0}]
    stick:
      up:    [{type: hid_axis, report: 63, byte: 5, wide: true, invert: true, positive: true}]
      down:  [{type: hid_axis, report: 63, byte: 5, wide: true, invert: true, positive: false}]
      left:  [{type: hid_axis, report: 63, byte: 3, wide: true, positive: false}]
      right: [{type: hid_axis, report: 63, byte: 3, wide: true, positive: true}]

# In the browser, S mode works only through WebHID (the HID preset above); the Gamepad API
# path can't read it.
