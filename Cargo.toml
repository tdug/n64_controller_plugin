[package]
name = "tdug_plugin"
version = "0.1.0"
edition = "2024"
description = "N64 controller/input plugin for Project64 (Zilmar spec) and Mupen64Plus"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tdug-n64-config"
path = "src/bin/config.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
web-time = "1"
gilrs = "0.11"
egui_plot = "0.38"
# monochrome_emoji_fonts bundles the icon glyphs several buttons use (e.g. "X", "+") so they
# render consistently everywhere, instead of depending on whatever the OS font happens to cover
# (they rendered as missing-glyph boxes on Windows; see tdug/n64_controller_plugin#6).
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-hid = "0.5"
futures-lite = "2"
async-io = "2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "HtmlCanvasElement"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_Media",
  "Win32_Security",
] }

[patch.crates-io]
# Patched to drive force feedback for pads gilrs only sees as a generic RawGameController
# (not an XInput-class Gamepad), e.g. the 8BitDo 64 over Bluetooth. See vendor/gilrs-core
# and tdug/n64_controller_plugin#3.
gilrs-core = { path = "vendor/gilrs-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
