[package]
name = "tdug_plugin"
version = "0.1.0"
edition = "2024"
description = "N64 controller/input plugin for Project64 (Zilmar spec) and Mupen64Plus"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tdug-n64-config"
path = "src/bin/config.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
gilrs = "0.11"
egui_plot = "0.38"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "HtmlCanvasElement"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_Media",
  "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
