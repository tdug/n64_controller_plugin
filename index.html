<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TDug N64 Input</title>
  <link data-trunk rel="rust" data-bin="tdug-n64-config" data-wasm-opt="0" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; color: #ccc; font-family: sans-serif; }
    #the_canvas_id { display: block; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">Loading N64 Input test harness…</div>
  <canvas id="the_canvas_id"></canvas>
  <script>
    // WebHID bridge for the Debug tab (raw HID input reports). Chrome/Edge only.
    window.tdugHid = [];
    window.tdugHidSupported = () => 'hid' in navigator;
    window.tdugHidConnect = async () => {
      if (!('hid' in navigator)) return;
      const devices = await navigator.hid.requestDevice({ filters: [] });
      for (const d of devices) {
        if (!d.opened) await d.open();
        const entry = { name: d.productName || '?', vid: d.vendorId, pid: d.productId, reports: {}, count: 0 };
        window.tdugHid.push(entry);
        d.addEventListener('inputreport', (e) => {
          entry.reports[String(e.reportId)] = Array.from(new Uint8Array(e.data.buffer));
          entry.count++;
        });
      }
    };
    window.tdugHidJson = () => JSON.stringify(window.tdugHid);
    // Unfiltered Gamepad API state, for the Debug tab.
    window.tdugPadsJson = () => JSON.stringify(Array.from(navigator.getGamepads ? navigator.getGamepads() : [])
      .filter(Boolean)
      .map(g => ({ index: g.index, id: g.id, mapping: g.mapping || '(none)', connected: g.connected,
                   buttons: g.buttons.map(b => b.value), axes: Array.from(g.axes),
                   rumble: !!(g.vibrationActuator) })));
    // Hide the loading text once eframe has painted.
    const obs = new MutationObserver(() => document.getElementById('loading')?.remove());
    obs.observe(document.getElementById('the_canvas_id'), { attributes: true });
  </script>
</body>
</html>
